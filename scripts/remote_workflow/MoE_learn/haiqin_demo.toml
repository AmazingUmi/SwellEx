# Small real-data continual-learning demonstration; not a performance study.
schema_version = 1

[remote]
host = "haiqin"
repository = "/mnt/SDD/project/SwellEx"
workspace = "/mnt/SDD/project/SwellEx_validation"
base_python = "/home/yiyang-lu/miniforge3/envs/pytorch/bin/python"
uv = "/mnt/SDD/project/SwellEx_validation/runtime_profile/tools/uv-0.12.19/uv-x86_64-unknown-linux-gnu/uv"

[validation]
device = "cuda"
seed = 2026
threads = 4
quick_timeout_s = 900
generation_timeout_s = 1800
training_timeout_s = 1800

[dataset]
event_name = "S5"
fs = 1500
segment_start_s = 0
segment_end_s = 119
segment_duration_s = 1.0
segment_step_s = 1.0
num_snapshots_per_segment = 1
snapshot_overlap_count = 0
frequency_selection_modes = ["deep", "shallow"]
split_strategy = "full_interleaved"
train_test_ratio = [4, 1]
train_side = "before"
half_duration_s = 800
gap_s = 15
test_step_s = 1
manual_dataset_variant_tag = "moe_learn_demo"
stage_mode = "interleaved"
val_fraction = 0.2

[rbd]
beam_selection = "best"
frequency_estimation = "selected"
use_plane_wave = false
normalize_spectrum = false

[training]
initial_epochs = 3
adapt_epochs = 2
warmup_epochs = 1
batch_size = 8
base_channels = 16
learning_rate = 0.001
old_expert_learning_rate = 0.0001
new_expert_learning_rate = 0.001
router_learning_rate = 0.001
seed = 2026
weight_decay = 0.0001

[continual]
stages = 2
initial_experts = 2
max_experts = 4
replay_mode = "buffer"
replay_size = 16
history_validation = true

[controller]
min_relative_gain = 0.01
max_old_relative_regression = 0.05
novelty_threshold = 3.0
balance_loss_weight = 0.01
