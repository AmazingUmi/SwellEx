[project]
name = "swellex-range-localization"
version = "0.1.0"
description = "Python data processing and range regression for the SwellEx-96 VLA"
requires-python = ">=3.14,<3.15"
dependencies = [
    "h5py==3.16.0",
    "matplotlib==3.10.9",
    "numpy==2.4.3",
    "scipy==1.18.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv]
package = false
required-version = "==0.12.19"
# Numerical processing and training run on the Linux x86-64 GPU host.
# The local dispatcher uses only the standard library and needs no uv sync.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
